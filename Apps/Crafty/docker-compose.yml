services:
    crafty:
        container_name: crafty_container
        image: registry.gitlab.com/crafty-controller/crafty-4:latest
        restart: always
        environment:
            - TZ=America/Sao_Paulo
        ports:
            - "8443:8443" # HTTPS
            - "8123:8123" # DYNMAP
            - "19132:19132/udp" # BEDROCK
            - "25500-25600:25500-25600" # MC SERV PORT RANGE
        volumes:
            - /home-data/containers-config/crafty-4/backups:/crafty/backups
            - /home-data/containers-config/crafty-4/logs:/crafty/logs
            - /home-data/containers-config/crafty-4/servers:/crafty/servers
            - /home-data/containers-config/crafty-4/config:/crafty/app/config
            - /home-data/containers-config/crafty-4/import:/crafty/import