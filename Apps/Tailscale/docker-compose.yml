
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    volumes:
      - /home-data/containers-config/tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    # Web interface: exposta automaticamente na porta 5252
    # Acesse em http://<tailscale-ip>:5252 dentro da tailnet
    # Ou em http://100.100.100.100:5252 (IP local do Tailscale)
    entrypoint:
      - /bin/sh
      - -c
      - |
        tailscaled --state=/var/lib/tailscale/tailscaled.state &
        sleep 10
        tailscale web --listen 0.0.0.0:5252

